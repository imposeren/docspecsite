# Commit hooks, run by prek. See docs/architecture/quality-gate.md.
# Ruff and mdformat run in environments prek creates; pyrefly and docs-check
# need docspecsite's own dependencies; they run through uv on the host, not
# in a container, so they see git's index and work in git worktrees.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3 # keep equal to the ruff pin in pyproject.toml
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        # Templates hold <placeholder> text that mdformat would escape; they are not docs.
        exclude: ^docs/meta/templates/
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-frontmatter==2.2.0

  - repo: local
    hooks:
      - id: no-fixed-config-dir
        name: config directory via $CLAUDE_CONFIG_DIR
        language: pygrep
        entry: '(?<!:-)(~|\$HOME)/\.claude(/|\b)'
        types: [text]
        exclude: ^\.pre-commit-config\.yaml$

      - id: pyrefly
        name: pyrefly (strict)
        language: system
        entry: uv run pyrefly check
        pass_filenames: false
        types: [python]

      # docspecsite checks its own docs with its own source, not a released tag.
      - id: docs-check
        name: docspecsite check --staged
        language: system
        entry: uv run docspecsite check --staged
        pass_filenames: false
        # Every commit: prek passes no deleted files to hooks, so a files: filter
        # would skip a commit that only deletes or renames a doc.
        always_run: true
