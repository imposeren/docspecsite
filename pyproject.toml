[project]
name = "docspecsite"
version = "0.3.0"
description = "Checks docs with front matter and renders every version of every doc from git history to a static site."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "griffelib>=2.4.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
docspecsite = "docspecsite.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly==1.4.0",
    "pytest>=9.2.0",
    "ruff==0.17.3",
]

[tool.pytest]
testpaths = ["tests"]
filterwarnings = ["error"]

# Lint and type-check settings: docs/architecture/quality-gate.md (DSS-0003).
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S101", "BLE001", "PLW0603", "N", "ISC", "TID252"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
# pytest puts the tests directory on sys.path, so tests import their conftest helpers directly.
search-path = ["tests"]
